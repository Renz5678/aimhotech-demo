</div>

<!-- Password -->

<div class="flex justify-between items-center px-1">
<label class="font-label-caps text-label-caps text-on-surface-variant block uppercase" for="password">Password</label>
<a class="font-body-sm text-body-sm text-secondary hover:underline transition-all" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">lock</span>
<input class="w-full pl-10 pr-10 py-3 bg-white border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline input-focus transition-all" id="password" name="password" placeholder="••••••••" type="password"/>

</div>

<!-- Micro-interactions Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.querySelector('form');
            const submitBtn = form.querySelector('button[type="submit"]');
            
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                // Visual feedback on submit
                submitBtn.disabled = true;
                submitBtn.innerHTML = `
                    <span class="animate-spin material-symbols-outlined text-[22px]">sync</span>
                    <span>Authenticating...</span>
                `;
                
                // Simulate network lag
                setTimeout(() => {
                    submitBtn.classList.remove('bg-primary');
                    submitBtn.classList.add('bg-secondary');
                    submitBtn.innerHTML = `
                        <span class="material-symbols-outlined text-[22px]">check_circle</span>
                        <span>Welcome, Admin</span>
                    `;
                }, 1500);
            });

            // Password visibility toggle
            const toggleBtn = document.querySelector('button[type="button"]');
            const passwordInput = document.getElementById('password');
            toggleBtn.addEventListener('click', () => {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                toggleBtn.querySelector('span').innerText = isPassword ? 'visibility_off' : 'visibility';
            });
        });
    </script>
