<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AImhotech - Confirm Patient</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {

        theme: {
          extend: {
            "colors": {
                    "tertiary-fixed-dim": "#ecbbb7",
                    "secondary-fixed-dim": "#becca4",
                    "on-tertiary-fixed": "#2f1412",
                    "outline-variant": "#c1c8c3",
                    "secondary-fixed": "#d9e8bf",
                    "on-error": "#ffffff",
                    "surface-container-high": "#e9e8e6",
                    "inverse-surface": "#2f312f",
                    "primary": "#07241a",
                    "tertiary": "#331716",
                    "on-secondary-container": "#5c6948",
                    "inverse-primary": "#aecebe",
                    "primary-container": "#1e3a2f",
                    "primary-fixed": "#caeada",
                    "on-tertiary-fixed-variant": "#603e3b",
                    "error": "#ba1a1a",
                    "surface-container-low": "#f4f3f1",
                    "outline": "#727974",
                    "on-secondary": "#ffffff",
                    "on-primary-fixed-variant": "#304c41",
                    "on-primary-fixed": "#032017",
                    "background": "#faf9f7",
                    "primary-fixed-dim": "#aecebe",
                    "on-primary-container": "#86a496",
                    "inverse-on-surface": "#f1f1ee",
                    "surface-container-highest": "#e3e2e0",
                    "secondary": "#566342",
                    "surface-bright": "#faf9f7",
                    "on-tertiary": "#ffffff",
                    "on-background": "#1a1c1b",
                    "surface-container-lowest": "#ffffff",
                    "error-container": "#ffdad6",
                    "on-primary": "#ffffff",
                    "on-error-container": "#93000a",
                    "surface": "#faf9f7",
                    "surface-dim": "#dadad8",
                    "surface-tint": "#486458",
                    "surface-container": "#eeeeeb",
                    "on-tertiary-container": "#c0928f",
                    "on-surface": "#1a1c1b",
                    "tertiary-fixed": "#ffdad7",
                    "on-secondary-fixed": "#141f05",
                    "tertiary-container": "#4c2c2a",
                    "secondary-container": "#d9e8bf",

            },
            "borderRadius": {

            "spacing": {

                    "base_unit": "4px",

                    "card_gap": "24px"
            },
            "fontFamily": {

<style>
        body {
            background-color: #faf9f7;
            font-family: 'IBM Plex Sans', sans-serif;
            color: #1a1c1b;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .layered-shadow {
            box-shadow: 0px 4px 20px rgba(30, 58, 47, 0.05);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            background-color: #8B9D77; /* Sage secondary variation */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex items-center justify-center min-h-screen p-0 md:p-8">
<!-- Mobile Device Container -->
<main class="w-full max-w-[480px] h-screen md:h-[844px] bg-background relative overflow-hidden flex flex-col shadow-2xl md:rounded-[40px] border-[8px] border-surface-container">
<!-- Status Bar Simulator (Top) -->
<div class="px-6 pt-4 pb-2 flex justify-between items-center text-on-surface/80">
<span class="font-data-sm text-data-sm">9:30</span>
<div class="flex gap-2">
<span class="material-symbols-outlined text-[18px]">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[18px]">wifi</span>
<span class="material-symbols-outlined text-[18px]">battery_full</span>
</div>
</div>
<!-- Header -->
<header class="px-6 py-4 flex justify-between items-center">
<div class="flex items-center gap-3">
<div class="w-10 h-10 bg-primary-container rounded-xl flex items-center justify-center relative">
<span class="material-symbols-outlined text-white text-[24px]" data-icon="health_and_safety">health_and_safety</span>
<!-- Sage Notch Detail -->
<div class="absolute -top-1 -right-1 w-3 h-3 bg-secondary-fixed rounded-full border-2 border-primary-container"></div>
</div>
<span class="font-title-sm text-title-sm font-semibold text-primary">Health Worker</span>
</div>
<div class="flex items-center gap-2 bg-secondary-container/30 px-3 py-1.5 rounded-full border border-secondary-fixed">
<div class="status-dot"></div>
<span class="font-label-caps text-label-caps text-on-secondary-fixed-variant">3 pending</span>
</div>
</header>
<!-- Main Task Scroll Area -->
<div class="flex-1 overflow-y-auto px-6 pb-32">
<!-- Progress Stepper -->
<div class="mt-4 mb-8">
<div class="flex justify-between items-center mb-4">
<span class="font-label-caps text-label-caps text-on-surface-variant">NEW SCREENING • STEP 1 OF 4</span>
</div>
<div class="grid grid-cols-4 gap-2 h-1.5 w-full">
<div class="bg-primary rounded-full"></div>
<div class="bg-surface-container-highest rounded-full"></div>
<div class="bg-surface-container-highest rounded-full"></div>
<div class="bg-surface-container-highest rounded-full"></div>
</div>
</div>
<!-- Page Title Area -->
<div class="flex items-center gap-4 mb-6">
<button class="w-10 h-10 rounded-xl bg-white border border-outline-variant/30 flex items-center justify-center hover:bg-surface-container transition-colors layered-shadow">
<span class="material-symbols-outlined text-primary text-[20px]" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-display-lg text-[28px] font-bold text-primary">Confirm patient</h1>
</div>
<!-- Patient Detail Card -->
<div class="bg-white rounded-2xl p-6 layered-shadow mb-6 border border-white/50 relative overflow-hidden">
<div class="flex items-start gap-5 mb-6">
<div class="w-16 h-16 rounded-full bg-secondary-fixed flex items-center justify-center border-4 border-white shadow-sm">
<span class="font-headline-md text-primary font-bold">MS</span>
</div>
<div class="flex flex-col">
<h2 class="font-headline-md text-headline-md text-primary mb-1">Maria Santos</h2>
<div class="flex flex-wrap gap-x-2 gap-y-1 text-on-surface-variant font-body-sm text-body-sm">
<span>BGY-041-00217</span>
<span class="opacity-30">•</span>
<span>58</span>
<span class="opacity-30">•</span>
<span>F</span>
<span class="opacity-30">•</span>
<span>last seen Jul 12</span>
</div>
</div>
</div>
<!-- Consent Confirmation Banner -->
<div class="bg-secondary-container/15 rounded-xl p-4 flex items-start gap-3 border border-secondary-container/40">
<div class="bg-secondary text-white rounded-full p-0.5 flex items-center justify-center mt-0.5">
<span class="material-symbols-outlined text-[16px] font-bold" data-icon="check" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<div class="flex flex-col">
<p class="font-body-sm text-body-sm text-on-secondary-fixed-variant leading-snug">
<span class="font-semibold">Consent on file</span> — recorded Mar 3, 2026, reconfirmable anytime
                        </p>
</div>
</div>
</div>
<!-- Secondary Action -->
<button class="w-full py-4 px-6 rounded-2xl border-2 border-secondary/20 font-title-sm text-title-sm text-secondary hover:bg-secondary-container/20 transition-all active:scale-[0.98] flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="person_search">person_search</span>
                Choose a different patient
            </button>
<!-- Decorative Visual (Asymmetric Tonal Layer) -->
<div class="absolute -right-20 -bottom-10 w-64 h-64 bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>
</div>
<!-- Sticky Bottom Action Bar -->
<div class="absolute bottom-0 left-0 w-full p-6 bg-gradient-to-t from-background via-background to-transparent pt-10">
<button class="w-full bg-primary text-white py-5 px-8 rounded-[20px] font-title-sm text-title-sm font-semibold flex items-center justify-center shadow-lg hover:bg-primary-container transition-all active:scale-[0.97]">
                Confirm &amp; continue
                <span class="material-symbols-outlined ml-2 text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
<!-- Android Navigation Bar (Indicator) -->
<div class="mt-6 flex justify-center">
<div class="w-32 h-1 bg-on-surface/20 rounded-full"></div>
</div>
</div>
</main>
<script>
        // Simple micro-interaction for button press
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousedown', () => {
                button.style.transform = 'scale(0.98)';
            });
            button.addEventListener('mouseup', () => {
                button.style.transform = 'scale(1)';
            });
            button.addEventListener('mouseleave', () => {
                button.style.transform = 'scale(1)';
            });
        });
    </script>
</body></html>
