<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@100..900&display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
        }
        .success-glow {
            filter: drop-shadow(0 10px 20px rgba(72, 100, 88, 0.15));
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
        body {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "background": "#faf9f7",
                        "inverse-on-surface": "#f1f1ee",
                        "on-secondary": "#ffffff",
                        "inverse-surface": "#2f312f",
                        "primary-fixed": "#caeada",
                        "surface-container-lowest": "#ffffff",
                        "inverse-primary": "#aecebe",
                        "on-tertiary": "#ffffff",
                        "on-error": "#ffffff",
                        "surface-container-low": "#f4f3f1",
                        "surface-container-highest": "#e3e2e0",
                        "surface-bright": "#faf9f7",
                        "on-surface": "#1a1c1b",
                        "secondary": "#566342",
                        "on-error-container": "#93000a",
                        "primary": "#07241a",
                        "surface-tint": "#486458",
                        "outline": "#727974",
                        "tertiary-fixed-dim": "#c7c6c5",
                        "on-tertiary-fixed": "#1a1c1b",
                        "secondary-container": "#d9e8bf",
                        "on-secondary-fixed-variant": "#3f4b2c",
                        "on-background": "#1a1c1b",
                        "outline-variant": "#c1c8c3",
                        "on-tertiary-container": "#9d9d9c",
                        "primary-container": "#1e3a2f",
                        "on-primary": "#ffffff",
                        "tertiary-fixed": "#e3e2e0",
                        "tertiary-container": "#343534",
                        "surface": "#faf9f7",
                        "on-primary-fixed-variant": "#304c41",
                        "tertiary": "#1f201f",
                        "surface-container-high": "#e9e8e6",
                        "secondary-fixed-dim": "#becca4",
                        "surface-dim": "#dadad8",
                        "primary-fixed-dim": "#aecebe",
                        "on-primary-container": "#86a496",
                        "error": "#ba1a1a",
                        "surface-container": "#eeeeeb",
                        "on-surface-variant": "#424844",
                        "error-container": "#ffdad6",
                        "surface-variant": "#e3e2e0",
                        "on-tertiary-fixed-variant": "#464746",
                        "secondary-fixed": "#d9e8bf",
                        "on-secondary-fixed": "#141f05",
                        "on-primary-fixed": "#032017",
                        "on-secondary-container": "#5c6948"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "12px",
                        "edge_margin": "20px",
                        "xs": "8px",
                        "stack_gap": "16px",
                        "md": "16px",
                        "lg": "24px",
                        "base": "4px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "label-sm": ["Figtree"],
                        "body-lg": ["Figtree"],
                        "body-md": ["Figtree"],
                        "headline-md": ["Figtree"],
                        "technical-id": ["IBM Plex Mono"],
                        "headline-sm": ["Figtree"],
                        "display-lg": ["Figtree"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", {"lineHeight": "1.4", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "body-lg": ["16px", {"lineHeight": "1.5", "fontWeight": "500"}],
                        "body-md": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "700"}],
                        "technical-id": ["13px", {"lineHeight": "1.4", "fontWeight": "500"}],
                        "headline-sm": ["20px", {"lineHeight": "1.4", "fontWeight": "700"}],
                        "display-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "800"}]
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-background text-on-background font-body-md selection:bg-primary-fixed selection:text-on-primary-fixed min-h-screen flex flex-col">
<!-- TopAppBar -->
<nav class="flex flex-col px-edge_margin pt-xl pb-md w-full bg-background z-40 sticky top-0">
<div class="flex justify-between items-center w-full">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center text-primary overflow-hidden shadow-sm">
<span class="material-symbols-outlined text-[24px]">health_and_safety</span>
</div>
<h1 class="text-headline-md font-headline-md text-primary">Barangay San Isidro</h1>
</div>
<div class="flex items-center bg-secondary-container px-sm py-xs rounded-full shadow-sm">
<span class="text-label-sm font-label-sm text-on-secondary-container">Fully synced</span>
</div>
</div>
</nav>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col items-center justify-center px-edge_margin pb-[100px] overflow-y-auto">
<div class="max-w-md w-full flex flex-col items-center text-center space-y-xl">
<!-- Success Illustration Container -->
<div class="relative w-64 h-64 flex items-center justify-center animate-float">
<div class="absolute inset-0 bg-secondary/5 rounded-full blur-3xl scale-125"></div>
<img alt="Sync Success State" class="w-full h-full object-contain success-glow relative z-10" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBSqfWuZfGcGXPs8qmmInNc8P1jf2hZe_RLuaFbN2fEs46TTCD5YvhNftRyqdnq2L_KanAj96AcwlWXDj83TV0soL9revtLUC10r5b89k3M2enG_ldlXjn1yJEU9rYWE0aeBonWWIr7XypCuxlR0hsmgnBtX7UUAtaPd7gZ31ho6KMEr3YCslfwqtRR_S981XijayprTSpqrVO1as4NDH49G7tPqi57JC-Ox_C61I_KcHOwr9pbP2wRCZ3YyUV0XJXSh-yu4N70D38"/>
</div>
<!-- Copy Content -->
<div class="space-y-md">
<h2 class="text-display-lg font-display-lg text-primary tracking-tight">All records synced</h2>
<p class="text-body-lg font-body-lg text-on-surface-variant max-w-[280px] mx-auto">
                    Your data is secure and up to date. Last sync: Just now.
                </p>
</div>
<!-- Details Card (Bento Style/Tactile) -->
<div class="w-full bg-surface-container-lowest rounded-xl p-lg border border-outline-variant/30 shadow-[0_4px_12px_rgba(30,58,47,0.04)] flex flex-col gap-md text-left">
<div class="flex items-center gap-md">
<div class="p-2 bg-secondary-container rounded-lg">
<span class="material-symbols-outlined text-on-secondary-container text-[20px]">cloud_done</span>
</div>
<div>
<p class="text-label-sm font-label-sm text-on-surface-variant uppercase tracking-widest">Storage Status</p>
<p class="text-body-md font-body-md text-primary font-bold">Encrypted & Uploaded</p>
</div>
</div>
<div class="h-[1px] w-full bg-outline-variant/20"></div>
<div class="flex items-center gap-md">
<div class="p-2 bg-primary-fixed rounded-lg">
<span class="material-symbols-outlined text-primary text-[20px]">verified</span>
</div>
<div>
<p class="text-label-sm font-label-sm text-on-surface-variant uppercase tracking-widest">Data Integrity</p>
<p class="text-body-md font-body-md text-primary font-bold">128 records verified</p>
</div>
</div>
</div>
<!-- Action Area -->
<div class="pt-lg w-full">
<button class="w-full h-[56px] rounded-xl border-2 border-secondary text-secondary font-headline-sm flex items-center justify-center gap-sm active:scale-[0.98] transition-all hover:bg-surface-container-high">
<span class="material-symbols-outlined">arrow_back</span>
<span>Back to Home</span>
</button>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-[72px] px-4 pb-safe bg-surface-container-lowest shadow-sm border-t border-outline-variant/30">
<!-- Home -->
<button class="flex flex-col items-center justify-center text-on-surface-variant transition-all hover:bg-surface-container-low px-4 py-2 rounded-xl">
<span class="material-symbols-outlined text-[24px]" data-icon="home">home</span>
<span class="text-label-sm font-label-sm mt-1">Home</span>
</button>
<!-- Screening -->
<button class="flex flex-col items-center justify-center text-on-surface-variant transition-all hover:bg-surface-container-low px-4 py-2 rounded-xl">
<span class="material-symbols-outlined text-[24px]" data-icon="medical_services">medical_services</span>
<span class="text-label-sm font-label-sm mt-1">Screening</span>
</button>
<!-- Lookup (Active State from semantic context, though this is a success screen, keeping it active for context of where they might have come from) -->
<button class="flex flex-col items-center justify-center text-primary font-bold transition-all scale-[0.95] px-4 py-2 rounded-xl bg-primary-fixed/30">
<span class="material-symbols-outlined text-[24px]" data-icon="search">search</span>
<span class="text-label-sm font-label-sm mt-1">Lookup</span>
</button>
<!-- Settings -->
<button class="flex flex-col items-center justify-center text-on-surface-variant transition-all hover:bg-surface-container-low px-4 py-2 rounded-xl">
<span class="material-symbols-outlined text-[24px]" data-icon="settings">settings</span>
<span class="text-label-sm font-label-sm mt-1">Settings</span>
</button>
</nav>
<script>
        // Micro-interactions for button presses
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', () => {
                btn.classList.add('scale-95');
            });
            btn.addEventListener('touchend', () => {
                btn.classList.remove('scale-95');
            });
        });
    </script>
</body></html>
