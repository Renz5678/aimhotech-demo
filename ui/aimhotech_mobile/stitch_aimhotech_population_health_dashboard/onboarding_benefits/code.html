<style>
        body {
            background-color: #F9F8F6; /* Soft Cream as requested */
            -webkit-font-smoothing: antialiased;
        }
        .android-frame {
            width: 100%;
            max-width: 412px;
            height: 100vh;
            max-height: 892px;
            margin: auto;
            position: relative;
            overflow: hidden;
            background-color: #faf9f7;
            box-shadow: 0 0 0 12px #1a1c1b, 0 0 0 14px #424844;
            border-radius: 40px;
        }
        .illustration-container {
            aspect-ratio: 1/1;
            width: 100%;
            background-color: #F9F8F6;
        }
        .nav-suppressed { display: none !important; }
        .tap-target { min-height: 48px; }
        .primary-shadow {
            box-shadow: 0 4px 12px rgba(30, 58, 47, 0.08);
        }
        .active-scale:active {
            transform: scale(0.96);
        }
    </style>

<body class="flex items-center justify-center min-h-screen p-4 sm:p-0">
<!-- Android Device Frame Wrapper -->
<div class="android-frame flex flex-col">
<!-- Status Bar Space (Mobile Identity) -->
<div class="h-10 w-full flex justify-between items-center px-8 pt-4">
<span class="text-label-sm font-label-sm text-on-surface">9:41</span>
<div class="flex gap-1">
<span class="material-symbols-outlined text-[16px]">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[16px]">wifi</span>
<span class="material-symbols-outlined text-[16px]">battery_full</span>
</div>
</div>
<!-- Main Onboarding Content -->
<main class="flex-1 flex flex-col overflow-y-auto">
<!-- Illustration Section -->
<div class="illustration-container relative overflow-hidden">
<img alt="Health journey illustration" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDNqaYbqp1TDgRHezewbYGEIJbc1CuNZBigx6jYlTXDYftoLQjWTay3b5RP5uJT6zHMtsghOir3SIuoCpXs-qSvtwB7ClMvys7lUy8ahi-_hl6VnESCF-nSi9Y7BF2w_OuffUgO88YcArzzVun7ANWmmE2tmvBygQgfOuMBi9wc2kNrhcXmYby2TK1g8VZK0Os3H_PQOGsLI32Z4bZuhVJH3A5m_gBf8zOTIFakRQTFeZgVDP7l1S_u5XXExTNaTW0pERZYRqilDeo"/>
<!-- Soft Gradient transition to content -->
<div class="absolute bottom-0 left-0 w-full h-24 bg-gradient-to-t from-background to-transparent"></div>
</div>
<!-- Text Content Section -->
<div class="px-edge_margin pt-md pb-xl flex flex-col flex-1">
<h1 class="text-headline-md font-headline-md text-primary mb-md">
                    Your health journey, shared.
                </h1>
<p class="text-body-lg font-body-lg text-on-surface-variant leading-relaxed">
                    AImhotech helps your health worker provide better care by having your history ready when you need it most.
                </p>
<!-- Spacer pushes indicators and actions to bottom -->
<div class="flex-1"></div>
<!-- Footer Actions -->
<div class="flex flex-col gap-stack_gap items-center w-full mt-xl">
<!-- Progress Indicator: Step 2 of 3 -->
<div class="flex gap-2 items-center mb-md">
<div class="h-2 w-2 rounded-full bg-outline-variant"></div>
<div class="h-2 w-8 rounded-full bg-primary-container shadow-inner"></div>
<div class="h-2 w-2 rounded-full bg-outline-variant"></div>
</div>
<!-- Primary Action Button -->
<button class="w-full h-[56px] bg-primary-container text-on-primary font-bold rounded-xl flex items-center justify-center gap-2 primary-shadow active-scale transition-all">
<span class="text-body-lg font-body-lg text-on-primary">Next</span>
<span class="material-symbols-outlined text-on-primary">arrow_forward</span>
</button>
<!-- Secondary/Text Action -->
<button class="tap-target px-4 text-label-sm font-label-sm text-outline hover:text-primary transition-colors uppercase tracking-widest">
                        Skip Onboarding
                    </button>
</div>
</div>
</main>
<!-- Navigation Bar (Suppressed based on "Transactional/Onboarding" mandate) -->
<!-- Navigation Shell suppressed for Task-Focused onboarding flow -->
<!-- Bottom Home Indicator (Android Style) -->
<div class="h-6 w-full flex justify-center items-center pb-2">
<div class="w-24 h-1 bg-on-surface/10 rounded-full"></div>
</div>
</div>
<!-- Micro-interaction Script -->
<script>
        document.querySelector('button').addEventListener('click', function() {
            // Simple animation feedback for prototype feel
            this.style.opacity = '0.8';
            setTimeout(() => {
                this.style.opacity = '1';
                // In a real app, this would navigate to the next step
                console.log('Navigating to step 3...');
            }, 150);
        });
    </script>
</body></html>
